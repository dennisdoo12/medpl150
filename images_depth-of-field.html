<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Depth of Field - Week 3</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 40px;
      line-height: 1.6;
    }
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
      gap: 20px;
      margin-top: 20px;
    }
    img {
      width: 100%;
      height: auto;
      border: 1px solid #ccc;
    }
    figcaption {
      margin-top: 8px;
      font-size: 14px;
    }
  </style>
</head>

<body>

  <a href="index.html">← Back to Home</a>

  <h1>Week 3: Depth of Field</h1>

  <div class="grid">

    <figure>
      <img src="img/image1_shallow-in-camera.jpeg" alt="Shallow depth of field in camera">
      <figcaption>Image 1: Shallow depth of field (in-camera)</figcaption>
    </figure>

    <figure>
      <img src="img/image2_deep-in-camera.JPG" alt="Deep depth of field in camera">
      <figcaption>Image 2: Deep depth of field (in-camera)</figcaption>
    </figure>

    <figure>
      <img src="img/image3_field-blur-before.JPG" alt="Before field blur">
      <figcaption>Image 3: Deep depth of field (before blur)</figcaption>
    </figure>

    <figure>
      <img src="img/image3_field-blur-after.jpg" alt="After field blur">
      <figcaption>Image 3: After Field Blur (edited to look shallow)</figcaption>
    </figure>

  </div>

</body>
</html>
